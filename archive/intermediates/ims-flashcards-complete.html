  button.primary { background: #4a90d9; color: white; border-color: #4a90d9; }
  button.primary:hover { background: #357abd; }
  .card-container { perspective: 1000px; margin-bottom: 20px; }
  .card { position: relative; width: 100%; height: 300px; cursor: pointer; }
  .card-inner { position: absolute; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  .card-front { background: white; }
  .card-back { background: #4a90d9; color: white; transform: rotateY(180deg); }
  .card-text { font-size: 2em; text-align: center; word-wrap: break-word; }
  .card-hint { position: absolute; bottom: 15px; font-size: 0.8em; opacity: 0.6; }
  .stats { text-align: center; color: #666; font-size: 0.9em; margin-bottom: 10px; }
  .progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
  .progress-fill { height: 100%; background: #4a90d9; transition: width 0.3s; }

let currentIndex = 0;
let currentFilter = 'all';
let filteredCards = [];
let flipped = false;

function init() {
  applyFilter();
  showCard();
}

function applyFilter() {
  if (currentFilter === 'all') {
    filteredCards = [...CARDS];
  } else {
    const ch = parseInt(currentFilter);
    filteredCards = CARDS.filter(c => c.ch === ch);
  }
  currentIndex = 0;
}

function showCard() {
  const statsEl = document.getElementById('stats');
  const progressFill = document.getElementById('progressFill');
  
  if (filteredCards.length === 0) {
    statsEl.textContent = 'No cards found';
    document.getElementById('frontText').textContent = 'No cards';
    document.getElementById('backText').textContent = '';
    progressFill.style.width = '0%';
    return;
  }
  
  const card = filteredCards[currentIndex];
  statsEl.textContent = `Card ${currentIndex + 1} of ${filteredCards.length} — Chapter ${card.ch}`;
  progressFill.style.width = `${((currentIndex + 1) / filteredCards.length) * 100}%`;
  
  document.getElementById('frontText').textContent = card.it;
  document.getElementById('backText').textContent = card.en;
  
  // Reset flip state
  flipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('flashcard').classList.toggle('flipped', flipped);
}

function nextCard() {
  if (filteredCards.length === 0) return;
  currentIndex = (currentIndex + 1) % filteredCards.length;
  showCard();
}

function shuffleCards() {
  for (let i = filteredCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredCards[i], filteredCards[j]] = [filteredCards[j], filteredCards[i]];
  }
  currentIndex = 0;
  showCard();
}

document.getElementById('chapterSelect').addEventListener('change', function(e) {
  currentFilter = e.target.value;
  applyFilter();
  showCard();
});

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    flipCard();
  } else if (e.code === 'ArrowRight') {
    nextCard();
  }
});

init();
</script>
