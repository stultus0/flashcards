<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Italian Made Simple — Flashcards (All Chapters)</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card-bg: #ffffff;
    --ink: #2b2620;
    --muted: #7a7168;
    --accent: #b3502e;
    --accent-soft: #e9d9cf;
    --good: #3e7c4f;
    --warn: #b07d2a;
    --bad: #a33b2e;
    --radius: 14px;
    --shadow: 0 6px 24px rgba(43,38,32,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  header { text-align: center; margin-bottom: 18px; max-width: 640px; }
  h1 { font-size: 1.5rem; letter-spacing: .02em; }
  .subtitle { color: var(--muted); font-size: .9rem; margin-top: 4px; font-style: italic; }

  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    margin-bottom: 14px; width: 100%; max-width: 520px;
  }
  .control-label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: .78rem; text-align: left; }
  .checkbox-label { display: flex; align-items: center; gap: 7px; min-height: 44px; align-self: end; padding: 0 5px; color: var(--ink); font-size: .9rem; cursor: pointer; user-select: none; }
  .checkbox-label input { width: 19px; height: 19px; accent-color: var(--accent); }
  select, button.btn {
    font-family: inherit; font-size: 1rem;
    min-height: 44px; padding: 9px 12px; border-radius: 8px;
    border: 1px solid #d8cfc2; background: var(--card-bg); color: var(--ink);
    cursor: pointer;
  }
  button.btn { align-self: end; }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }

  .progress-wrap { width: 100%; max-width: 520px; margin-bottom: 14px; }
  .progress-label { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
  .progress-bar { height: 8px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .3s ease; }

  .deck { width: 100%; max-width: 520px; }
  .card {
    position: relative; width: 100%; min-height: 300px;
    cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .face {
    position: absolute; inset: 0;
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 28px; text-align: center;
    transition: opacity .25s ease;
  }
  .face.front { z-index: 2; }
  .face.back { z-index: 1; opacity: 0; pointer-events: none; }
  .card.flipped .face.front { opacity: 0; pointer-events: none; }
  .card.flipped .face.back { opacity: 1; pointer-events: auto; }
  .tag {
    font-size: .68rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft);
    padding: 3px 10px; border-radius: 99px; margin-bottom: 18px;
  }
  .front-word { font-size: 2.2rem; line-height: 1.25; }
  .front-gender { font-size: 1rem; color: var(--muted); margin-top: 6px; }
  .hint { position: absolute; bottom: 14px; left: 0; right: 0; font-size: .75rem; color: var(--muted); font-style: italic; }
  .back-word { font-size: 1.9rem; line-height: 1.25; }
  .back-extra { font-size: 1.05rem; color: var(--muted); margin-top: 10px; line-height: 1.5; }

  .grades { display: flex; gap: 10px; margin-top: 18px; width: 100%; max-width: 520px; }
  .grade {
    flex: 1; padding: 12px 6px; border-radius: 10px; border: none;
    font-family: inherit; font-size: .95rem; font-weight: bold; cursor: pointer;
    color: #fff; transition: transform .1s, filter .1s;
  }
  .grade:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .grade.again { background: var(--bad); }
  .grade.hard   { background: var(--warn); }
  .grade.good   { background: var(--good); }
  .grade.easy   { background: #4a6fa5; }
  .grades.hidden { visibility: hidden; }

  .stats { margin-top: 22px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; font-size: .85rem; color: var(--muted); }
  .stats b { color: var(--ink); }
  .save-note { margin-top: 9px; max-width: 520px; color: var(--muted); text-align: center; font-size: .76rem; }

  .done {
    display: none; width: 100%; max-width: 520px;
    background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 40px 30px; text-align: center;
  }
  .done h2 { color: var(--accent); margin-bottom: 10px; }
  .done p { color: var(--muted); margin-bottom: 20px; line-height: 1.6; }

  @media (max-width: 600px) {
    body { padding: max(16px, env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom)); }
    header { margin-bottom: 14px; }
    h1 { font-size: 1.28rem; }
    .subtitle { font-size: .82rem; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .control-label { min-width: 0; }
    .control-label select { width: 100%; min-width: 0; }
    .controls .btn { grid-column: 1 / -1; width: 100%; }
    .card { min-height: 285px; }
    .face { padding: 26px 20px; }
    .front-word { font-size: 1.72rem; }
    .back-word { font-size: 1.48rem; }
    .back-extra { font-size: .98rem; }
    .grades { gap: 7px; margin-top: 14px; }
    .grade { min-height: 48px; padding: 10px 3px; font-size: .9rem; }
    .stats { gap: 10px; font-size: .78rem; }
  }
  @media (max-width: 360px) {
    .controls { grid-template-columns: 1fr; }
    .front-word { font-size: 1.5rem; }
    .grade { font-size: .8rem; }
  }
</style>
</head>

/* ============================================================
   SPACED REPETITION (simple SM-2-ish)
   ============================================================ */
const STORE_KEY = "imsFlashcards_all_v1";
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { progress: {}, seen: {} };
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

function getProg(id) {
  if (!state.progress[id]) state.progress[id] = { reps: 0, interval: 0, ease: 2.5, due: 0 };
  return state.progress[id];
}
function markSeen(id) {
  state.seen[id] = (state.seen[id] || 0) + 1;
}

const CHAPTER_ORDER = { ch1: 1, ch2: 2, ch3: 3, ch4: 4, ch5: 5, ch7: 6, ch8: 7, ch9: 8, ch10: 9, ch11: 10, ch13: 11, ch14: 12, ch15: 13, ch16: 14, ch17: 15, ch19: 16, ch20: 17, ch21: 18, ch22: 19, ch23: 20, ch24: 21, ch25: 22, ch26: 23, ch27: 24, ch28: 25, ch29: 26, ch30: 27, ch31: 28, ch32: 29, ch33: 30, ch34: 31, ch35: 32, ch36: 33, ch37: 34, ch38: 35, ch39: 36, ch40: 37 };
const STUDY_THROUGH = { through1: 1, through2: 2, through3: 3, through4: 4, through5: 5, through7: 6, through8: 7, through9: 8, through10: 9, through11: 10, through13: 11, through14: 12, through15: 13, through16: 14, through17: 15, through19: 16, through20: 17, through21: 18, through22: 19, through23: 20, through24: 21, through25: 22, through26: 23, through27: 24, through28: 25, through29: 26, through30: 27, through31: 28, through32: 29, through33: 30, through34: 31, through35: 32, through36: 33, through37: 34, through38: 35, through39: 36, through40: 37 };

function onlySelectedChapter() {
  return $("onlyChapter").checked;
}

function cardsForSet(setFilter) {
  const lastChapter = STUDY_THROUGH[setFilter] ?? 37;
  return CARDS.filter(c => onlySelectedChapter()
    ? CHAPTER_ORDER[c.set] === lastChapter
    : CHAPTER_ORDER[c.set] <= lastChapter);
}

function shuffle(cards) {
  const result = [...cards];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function buildDeck(setFilter) {
  const now = Date.now();
  const due = cardsForSet(setFilter).filter(c => {
    const p = state.progress[cardId(c)];
    return !p || p.due <= now;
  });
  return shuffle(due);
}
function cardId(c) { return c.it.replace(/\W+/g, "_"); }
function getDue(c) {
  const p = state.progress[cardId(c)];
  return p ? p.due : 0;
}

function grade(id, g) {
  const p = getProg(id);
  const now = Date.now();
  if (g === "again") {
    p.reps = 0;
    p.interval = 1;
    p.ease = Math.max(1.3, p.ease - 0.2);
  } else {
    p.reps += 1;
    if (g === "hard") {
      p.interval = Math.max(1, Math.round(p.interval * 1.2));
      p.ease = Math.max(1.3, p.ease - 0.15);
    } else if (g === "good") {
      p.interval = p.reps === 1 ? 10 : p.reps === 2 ? 60 : Math.round(p.interval * p.ease);
    } else {
      p.interval = p.reps === 1 ? 30 : p.reps === 2 ? 240 : Math.round(p.interval * p.ease * 1.3);
      p.ease = Math.min(3.0, p.ease + 0.1);
    }
    p.due = now + p.interval * 60000;
  }
  saveState();
}

/* ============================================================
   UI
   ============================================================ */
const $ = id => document.getElementById(id);
let queue = [];
let idx = 0;
let flipped = false;
let dir = "it-en";

function currentSet() { return $("setSelect").value; }

function render() {
  const total = cardsForSet(currentSet()).length;
  const shown = queue.length;

  const c = queue[idx];
  if (!c) { showDone(); return; }

  const frontIsIt = dir === "it-en";
  const front = frontIsIt ? c.it : c.en;
  const back  = frontIsIt ? c.en : c.it;

  $("frontWord").textContent = front;
  $("backWord").textContent = back;
  $("frontTag").textContent = c.type + (c.gender && frontIsIt ? " · " + c.gender : "");
  $("backTag").textContent = frontIsIt ? "English" : "Italian";
  $("frontGender").textContent = frontIsIt && c.gender ? (c.gender === "both" ? "masc. or fem." : c.gender === "m" ? "masculine" : c.gender === "f" ? "feminine" : c.gender) : "";
  $("backExtra").textContent = c.extra || "";

  const doneCount = Math.max(0, idx);
  $("progText").textContent = shown ? `Card ${idx + 1} of ${shown}` : "No cards due";
  $("pctText").textContent = total ? Math.round(doneCount / total * 100) + "%" : "0%";
  $("progFill").style.width = total ? (doneCount / total * 100) + "%" : "0%";

  $("grades").classList.toggle("hidden", !flipped);
}

function setCardFace(showBack) {
  const front = document.querySelector(".face.front");
  const back = document.querySelector(".face.back");
  front.style.display = showBack ? "none" : "flex";
  front.style.opacity = showBack ? "0" : "1";
  back.style.display = showBack ? "flex" : "none";
  back.style.opacity = showBack ? "1" : "0";
}

function flip() {
  if (!queue.length) return;
  flipped = !flipped;
  $("card").classList.toggle("flipped", flipped);
  setCardFace(flipped);
  if (flipped) {
    markSeen(cardId(queue[idx]));
    saveState();
    updateStats();
  }
  $("grades").classList.toggle("hidden", !flipped);
}

function advance(g) {
  if (!flipped) return;
  const c = queue[idx];
  grade(cardId(c), g);
  idx++;
  flipped = false;
  $("card").classList.remove("flipped");
  setCardFace(false);
  updateStats();
  render();
}

function updateStats() {
  const total = CARDS.length;
  const now = Date.now();
  const learned = Object.values(state.progress).filter(p => p.reps >= 2 && p.interval >= 60).length;
  const dueNow = cardsForSet(currentSet()).filter(c => {
    const p = state.progress[cardId(c)];
    return !p || p.due <= now;
  }).length;
  const seen = Object.keys(state.seen).length;
  $("statDone").textContent = learned;
  $("statDue").textContent = dueNow;
  $("statSeen").textContent = seen;
}

function showDone() {
  $("deck").style.display = "none";
  $("grades").style.display = "none";
  $("done").style.display = "block";
  const total = cardsForSet(currentSet()).length;
  $("doneText").innerHTML =
    `You reviewed all <b>${queue.length}</b> due card${queue.length !== 1 ? "s" : ""}.<br>` +
    `The rest of the set will come back later via spaced repetition.<br>` +
    `<span style="font-size:.85em;color:var(--muted)">Tip: press "Study again" to re-drill the same batch immediately.</span>`;
  updateStats();
}

function startDeck() {
  $("done").style.display = "none";
  $("deck").style.display = "";
  $("grades").style.display = "";
  queue = buildDeck(currentSet());
  idx = 0;
  flipped = false;
  $("card").classList.remove("flipped");
  setCardFace(false);
  if (!queue.length) {
    showDone();
    $("doneText").innerHTML = `Nothing is due right now for this set. 🎉<br>Cards you marked Again/Hard will return within minutes.`;
  } else {
    render();
  }
}

/* events */
$("card").addEventListener("click", () => { if (queue.length) flip(); });
document.querySelectorAll(".grade").forEach(btn => {
  btn.addEventListener("click", e => { e.stopPropagation(); advance(btn.dataset.grade); });
});
$("setSelect").addEventListener("change", startDeck);
$("onlyChapter").addEventListener("change", startDeck);
$("dirSelect").addEventListener("change", e => { dir = e.target.value; render(); });
$("resetBtn").addEventListener("click", () => {
  if (confirm("Reset all flashcard progress? This clears your spaced-repetition schedule.")) {
    state = { progress: {}, seen: {} };
    saveState();
    startDeck();
  }
});
$("restartBtn").addEventListener("click", startDeck);

/* keyboard shortcuts */
document.addEventListener("keydown", e => {
  if (!queue.length) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  else if (flipped) {
    if (e.key === "1") advance("again");
    if (e.key === "2") advance("hard");
    if (e.key === "3") advance("good");
    if (e.key === "4") advance("easy");
  }
});

/* init */
startDeck();
updateStats();
</script>
