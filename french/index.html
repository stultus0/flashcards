<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>French Flashcards</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card-bg: #ffffff;
    --ink: #2b2620;
    --muted: #7a7168;
    --accent: #b3502e;
    --accent-soft: #e9d9cf;
    --good: #3e7c4f;
    --warn: #b07d2a;
    --bad: #a33b2e;
    --radius: 14px;
    --shadow: 0 6px 24px rgba(43,38,32,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  header { text-align: center; margin-bottom: 18px; max-width: 640px; }
  h1 { font-size: 1.5rem; letter-spacing: .02em; }
  .subtitle { color: var(--muted); font-size: .9rem; margin-top: 4px; font-style: italic; }

  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    margin-bottom: 14px; width: 100%; max-width: 520px;
  }
  .control-label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: .78rem; text-align: left; }
  .checkbox-label { display: flex; align-items: center; gap: 7px; min-height: 44px; align-self: end; padding: 0 5px; color: var(--ink); font-size: .9rem; cursor: pointer; user-select: none; }
  .checkbox-label input { width: 19px; height: 19px; accent-color: var(--accent); }
  select, button.btn {
    font-family: inherit; font-size: 1rem;
    min-height: 44px; padding: 9px 12px; border-radius: 8px;
    border: 1px solid #d8cfc2; background: var(--card-bg); color: var(--ink);
    cursor: pointer;
  }
  button.btn { align-self: end; }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }

  .progress-wrap { width: 100%; max-width: 520px; margin-bottom: 14px; }
  .progress-label { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
  .progress-bar { height: 8px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .3s ease; }

  .deck { width: 100%; max-width: 520px; }
  .card {
    position: relative; width: 100%; min-height: 300px;
    cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .face {
    position: absolute; inset: 0;
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 28px; text-align: center;
    transition: opacity .25s ease;
  }
  .face.front { z-index: 2; }
  .face.back { z-index: 1; opacity: 0; pointer-events: none; }
  .card.flipped .face.front { opacity: 0; pointer-events: none; }
  .card.flipped .face.back { opacity: 1; pointer-events: auto; }
  .tag {
    font-size: .68rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft);
    padding: 3px 10px; border-radius: 99px; margin-bottom: 18px;
  }
  .front-word { font-size: 2.2rem; line-height: 1.25; }
  .front-gender { font-size: 1rem; color: var(--muted); margin-top: 6px; }
  .hint { position: absolute; bottom: 14px; left: 0; right: 0; font-size: .75rem; color: var(--muted); font-style: italic; }
  .speak-btn {
    border: 1px solid #d8cfc2; background: var(--card-bg); color: var(--ink);
    border-radius: 99px; padding: 7px 14px; margin-top: 14px;
    font-family: inherit; font-size: .9rem; cursor: pointer; min-height: 38px;
  }
  .speak-btn:hover { border-color: var(--accent); color: var(--accent); }
  .pron-status { position: absolute; bottom: 36px; left: 0; right: 0; font-size: .72rem; color: var(--muted); font-style: italic; text-align: center; min-height: 1em; }
  .back-word { font-size: 1.9rem; line-height: 1.25; }
  .back-example { font-size: 1rem; color: var(--accent, #4a7c6f); margin-top: 10px; line-height: 1.5; font-style: italic; border-left: 3px solid var(--accent, #4a7c6f); padding-left: 10px; }
  .back-extra { font-size: 1.05rem; color: var(--muted); margin-top: 10px; line-height: 1.5; }

  .grades { display: flex; gap: 10px; margin-top: 18px; width: 100%; max-width: 520px; }
  .grade {
    flex: 1; padding: 12px 6px; border-radius: 10px; border: none;
    font-family: inherit; font-size: .95rem; font-weight: bold; cursor: pointer;
    color: #fff; transition: transform .1s, filter .1s;
  }
  .grade:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .grade.again { background: var(--bad); }
  .grade.hard   { background: var(--warn); }
  .grade.good   { background: var(--good); }
  .grade.easy   { background: #4a6fa5; }
  .grades.hidden { visibility: hidden; }

  .stats { margin-top: 22px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; font-size: .85rem; color: var(--muted); }
  .stats b { color: var(--ink); }
  .save-note { margin-top: 9px; max-width: 520px; color: var(--muted); text-align: center; font-size: .76rem; }

  .done {
    display: none; width: 100%; max-width: 520px;
    background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 40px 30px; text-align: center;
  }
  .done h2 { color: var(--accent); margin-bottom: 10px; }
  .done p { color: var(--muted); margin-bottom: 20px; line-height: 1.6; }

  .check-row { display: flex; flex-wrap: wrap; gap: 9px 16px; align-items: center; justify-content: center; }
  @media (max-width: 600px) {
    body { padding: max(16px, env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom)); }
    header { margin-bottom: 14px; }
    h1 { font-size: 1.28rem; }
    .subtitle { font-size: .82rem; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .check-row { display: flex; flex-wrap: wrap; gap: 9px; grid-column: 1 / -1; }
    .control-label { min-width: 0; }
    .control-label select { width: 100%; min-width: 0; }
    .controls .btn { grid-column: 1 / -1; width: 100%; }
    .card { min-height: 285px; }
    .face { padding: 26px 20px; }
    .front-word { font-size: 1.72rem; }
    .back-word { font-size: 1.48rem; }
    .back-example { font-size: .95rem; }
    .back-extra { font-size: .98rem; }
    .grades { gap: 7px; margin-top: 14px; }
    .grade { min-height: 48px; padding: 10px 3px; font-size: .9rem; }
    .stats { gap: 10px; font-size: .78rem; }
  }
  @media (max-width: 360px) {
    .controls { grid-template-columns: 1fr; }
    .front-word { font-size: 1.5rem; }
    .grade { font-size: .8rem; }
  }
</style>
</head>
<body>

<header>
  <h1>🇫🇷 French Flashcards</h1>
  <div class="subtitle">Vocabulary from <i>Invitation au Français</i> (Holt McDougal)</div>
</header>

<div class="controls" aria-label="Study settings">
  <label class="control-label" for="setSelect">Study through
    <select id="setSelect">
      <option value="through1">Lesson 1 — Bonjour! (salutations)</option>
      <option value="through2">Lesson 2 — Famille et copains</option>
      <option value="through3">Lesson 3 — Nationalités & âge</option>
      <option value="through4">Lesson 4 — Bon appétit! (nourriture)</option>
      <option value="through5">Lesson 5 — De jour en jour (boissons, argent)</option>
      <option value="through6">Lesson 6 — Une invitation (heure, jours, date)</option>
      <option value="through7">Lesson 7 — Mes activités quotidiennes</option>
      <option value="through8">Lesson 8 — Qu'est-ce qu'on fait? (loisirs, sports)</option>
      <option value="through9">Lesson 9 — Les personnes et les objets</option>
      <option value="through10">Lesson 10 — Vive la différence! (apparence)</option>
      <option value="through11">Lesson 11 — Le copain de Mireille</option>
      <option value="through12">Lesson 12 — La voiture de Roger</option>
      <option value="through13">Lesson 13 — La ville et la maison</option>
      <option value="through14">Lesson 14 — Week-end à Paris</option>
      <option value="through15">Lesson 15 — Au café de l'Université</option>
      <option value="through16">Lesson 16 — Mes voisins (animaux)</option>
      <option value="through17">Lesson 17 — L'achat des vêtements</option>
      <option value="through18">Lesson 18 — Rien n'est parfait! (shopping)</option>
      <option value="through19">Lesson 19 — Un choix difficile</option>
      <option value="through20">Lesson 20 — Alice a un job</option>
      <option value="through21">Lesson 21 — Le week-end et les vacances</option>
      <option value="through22">Lesson 22 — Vive le week-end!</option>
      <option value="through23">Lesson 23 — Wallabi (sports d'hiver, télé)</option>
      <option value="through24">Lesson 24 — Où est de la chance?</option>
      <option value="through25">Lesson 25 — Les repas</option>
      <option value="through26">Lesson 26 — À la cantine</option>
      <option value="through27">Lesson 27 — Un client difficile</option>
      <option value="through28" selected>Lesson 28 — Pique-nique</option>
    </select>
  </label>
  <div class="check-row">
    <label class="checkbox-label" for="onlyChapter">
      <input type="checkbox" id="onlyChapter">
      <span>Only this lesson</span>
    </label>
  </div>
  <label class="control-label" for="dirSelect">Direction
    <select id="dirSelect">
      <option value="fr-en" selected>French → English</option>
      <option value="en-fr">English → French</option>
    </select>
  </label>
  <button class="btn" id="resetBtn">Reset progress</button>
</div>

<div class="progress-wrap">
  <div class="progress-label"><span id="progText">Card 1 of —</span><span id="pctText">0%</span></div>
  <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
</div>

<div class="deck" id="deck">
  <div class="card" id="card">
    <div class="face front">
      <div class="tag" id="frontTag">Noun</div>
      <div class="front-word" id="frontWord">la salle de bain</div>
      <div class="front-gender" id="frontGender">masculine</div>
      <button class="speak-btn" id="speakBtn" type="button">🔊 Pronunciation</button>
      <div class="pron-status" id="pronStatus"></div>
      <div class="hint">Click the card to reveal</div>
    </div>
    <div class="face back">
      <div class="tag" id="backTag">English</div>
      <div class="back-word" id="backWord">the bathroom</div>
      <div class="back-example" id="backExample"></div>
      <div class="back-extra" id="backExtra"></div>
    </div>
  </div>
</div>

<div class="grades hidden" id="grades">
  <button class="grade again" data-grade="again">Again</button>
  <button class="grade hard" data-grade="hard">Hard</button>
  <button class="grade good" data-grade="good">Good</button>
  <button class="grade easy" data-grade="easy">Easy</button>
</div>

<div class="done" id="done">
  <h2>Bien joué ! 🎉</h2>
  <p id="doneText"></p>
  <button class="btn" id="restartBtn">Study again</button>
</div>

<div class="stats">
  <span>Learned: <b id="statDone">0</b></span>
  <span>Due now: <b id="statDue">0</b></span>
  <span>Total seen: <b id="statSeen">0</b></span>
</div>
<div class="save-note" aria-live="polite">Progress is saved automatically in this browser on this device.</div>

/* ============================================================
   SPACED REPETITION (simple SM-2-ish)
   ============================================================ */
const STORE_KEY = "frFlashcards_l1_28_v1";
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { progress: {}, seen: {} };
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

function getProg(id) {
  if (!state.progress[id]) state.progress[id] = { reps: 0, interval: 0, ease: 2.5, due: 0 };
  return state.progress[id];
}
function markSeen(id) {
  state.seen[id] = (state.seen[id] || 0) + 1;
}

const STUDY_THROUGH = {};
for (let _i = 1; _i <= 28; _i++) STUDY_THROUGH["through" + _i] = _i;
// Cards store their lesson as set:"lN"; derive the number from it.
function cardLesson(c) { return parseInt(c.set.slice(1), 10); }

function onlySelectedChapter() {
  return $("onlyChapter").checked;
}

function cardsForSet(setFilter) {
  const lastLesson = STUDY_THROUGH[setFilter] !== undefined ? STUDY_THROUGH[setFilter] : 28;
  return CARDS.filter(c => onlySelectedChapter()
    ? cardLesson(c) === lastLesson
    : cardLesson(c) <= lastLesson);
}

function shuffle(cards) {
  const result = [...cards];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function buildDeck(setFilter) {
  const now = Date.now();
  const due = cardsForSet(setFilter).filter(c => {
    const p = state.progress[cardId(c)];
    return !p || p.due <= now;
  });
  return shuffle(due);
}
function cardId(c) { return c.fr.replace(/\W+/g, "_"); }
function getDue(c) {
  const p = state.progress[cardId(c)];
  return p ? p.due : 0;
}

function grade(id, g) {
  const p = getProg(id);
  const now = Date.now();
  if (g === "again") {
    p.reps = 0;
    p.interval = 1;
    p.ease = Math.max(1.3, p.ease - 0.2);
  } else {
    p.reps += 1;
    if (g === "hard") {
      p.interval = Math.max(1, Math.round(p.interval * 1.2));
      p.ease = Math.max(1.3, p.ease - 0.15);
    } else if (g === "good") {
      p.interval = p.reps === 1 ? 10 : p.reps === 2 ? 60 : Math.round(p.interval * p.ease);
    } else {
      p.interval = p.reps === 1 ? 30 : p.reps === 2 ? 240 : Math.round(p.interval * p.ease * 1.3);
      p.ease = Math.min(3.0, p.ease + 0.1);
    }
    p.due = now + p.interval * 60000;
  }
  saveState();
}

   UI
   ============================================================ */

/* ============================================================
   Pronunciation — pre-rendered MP3s hosted alongside this page
   (audio/<slug>.mp3, listed in manifest.json). Plays from the
   same origin: no CORS, no proxy, near-instant after first load.
   Falls back to live Google Translate TTS (direct stream, then
   CORS proxy) only for words missing a local file.
   ============================================================ */
let pronAudio = null;
let pronToken = 0;
let currentFrench = null;
let audioManifest = null; // word -> "audio/xxx.mp3"

async function loadManifest() {
  try {
    const res = await fetch("manifest.json", {cache: "no-store"});
    if (res.ok) audioManifest = await res.json();
  } catch (e) { /* offline or missing — streaming fallback covers it */ }
}

function localAudioPath(word) {
  if (!audioManifest || !word) return null;
  const key = Object.keys(audioManifest).find(k => k.toLowerCase() === word.toLowerCase());
  if (!key) return null;
  let p = audioManifest[key];
  return p.startsWith("audio/") ? p : "audio/" + p;
}

function ttsUrl(text, bust) {
  let u = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&q=" + encodeURIComponent(text) + "&tl=fr&tt=en";
  if (bust) u += "&_cb=" + bust;
  return u;
}

function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, {cache: "no-store", signal: ctrl.signal}).finally(() => clearTimeout(t));
}

async function fetchTtsBytes(word) {
  // attempt 1: direct (fails fast when CORS-blocked)
  try {
    const res = await fetchWithTimeout(ttsUrl(word), 5000);
    if (res.ok) {
      const blob = await res.blob();
      if (blob.type.includes("audio")) return blob;
    }
  } catch (e) { /* blocked or timed out — try proxy */ }
  // attempt 2: public CORS proxy (returns JSON: {"contents":"data:audio/mpeg;base64,..."})
  const proxied = "https://api.allorigins.win/get?url=" + encodeURIComponent(ttsUrl(word));
  let res;
  try {
    res = await fetchWithTimeout(proxied, 15000);
  } catch (e) {
    throw new Error("proxy timed out after 15s — click 🔊 again");
  }
  if (!res.ok) throw new Error("proxy error (" + res.status + ") — click 🔊 again");
  const data = await res.json();
  const m = (data.contents || "").match(/^data:audio\/[^;]+;base64,(.+)$/s);
  if (!m) throw new Error("proxy returned no audio — click 🔊 again");
  const bytes = Uint8Array.from(atob(m[1]), c => c.charCodeAt(0));
  return new Blob([bytes], {type: "audio/mpeg"});
}

function stopPron() {
  pronToken++;
  if (pronAudio) {
    pronAudio.pause();
    pronAudio.removeAttribute("src");
    pronAudio.load();
    pronAudio = null;
  }
}

function updateSpeakButton(frenchWord) {
  currentFrench = frenchWord;
  const btn = $("speakBtn");
  if (!frenchWord) {
    btn.style.display = "none";
    $("pronStatus").textContent = "";
    stopPron();
    return;
  }
  btn.style.display = "";
  stopPron();
}

async function playPron(token, word, t0, viaFallback) {
  const status = $("pronStatus");
  // Fast path: pre-rendered MP3 hosted with this page (same origin, no CORS).
  if (!viaFallback) {
    const local = localAudioPath(word);
    if (local) {
      const a = document.createElement("audio");
      pronAudio = a;
      a.src = local;
      status.textContent = "Playing…";
      a.onended = () => { if (token === pronToken) { status.textContent = ""; pronAudio = null; } };
      a.onerror = async () => {
        if (token !== pronToken || !a.error) return;
        // Local file missing/corrupt — fall back to live TTS.
        await playPron(token, word, t0, true);
      };
      try { await a.play(); } catch(e) {
        if (token === pronToken) status.textContent = "Click 🔊 again to start playback.";
      }
      return;
    }
  }
  if (viaFallback) {
    status.textContent = "Streaming blocked — downloading… (≤15s)";
    try {
      const blob = await fetchTtsBytes(word);
      const url = URL.createObjectURL(blob);
      const a = new Audio(url);
      a.onended = () => { URL.revokeObjectURL(url); if (token === pronToken) status.textContent = ""; };
      a.onerror = () => { URL.revokeObjectURL(url); if (token === pronToken) status.textContent = "Downloaded but playback failed — click 🔊 again."; };
      status.textContent = "Playing (in memory, nothing stored)…";
      await a.play();
    } catch(e) {
      if (token === pronToken) status.textContent = e.message;
    }
    return;
  }
  const a = document.createElement("audio");
  a.preload = "auto";
  pronAudio = a;
  a.src = ttsUrl(word, Date.now());
  status.textContent = "Loading pronunciation…";
  a.onplaying = () => { if (token === pronToken) status.textContent = "Playing…"; };
  a.onended = () => { if (token === pronToken) { status.textContent = ""; pronAudio = null; } };
  a.onerror = async () => {
    if (token !== pronToken || !a.error) return;
    if (a.error.code === 4) {
      await playPron(token, word, t0, true);
    } else {
      status.textContent = "Playback error — check internet, then click 🔊 again.";
    }
  };
  try { await a.play(); } catch(e) {
    if (token === pronToken) status.textContent = "Click 🔊 again to start playback.";
  }
}

$("speakBtn").addEventListener("click", (e) => {
  e.stopPropagation(); // don't flip the card
  if (!currentFrench) return;
  const token = ++pronToken;
  playPron(token, currentFrench, performance.now(), false);
});

function render() {
  const total = cardsForSet(currentSet()).length;
  const shown = queue.length;

  const c = queue[idx];
  if (!c) { showDone(); return; }

  const frontIsIt = dir === "fr-en";
  const front = frontIsIt ? c.fr : c.en;
  const back  = frontIsIt ? c.en : c.fr;

  $("frontWord").textContent = front;
  $("backWord").textContent = back;
  $("pronStatus").textContent = "";
  updateSpeakButton(frontIsIt ? c.fr : null);
  
  // Build tag: type + irregular marker
  let tagText = c.type;
  if (c.irregular) tagText += " · irregular";
  $("frontTag").textContent = tagText + (c.gender && frontIsIt ? " · " + c.gender : "");
  $("backTag").textContent = frontIsIt ? "English" : "French";
  $("frontGender").textContent = frontIsIt && c.gender ? (c.gender === "both" ? "masc. or fem." : c.gender === "m" ? "masculine" : c.gender === "f" ? "feminine" : c.gender) : "";
  const exText = c.example ? "« " + c.example + " »" : "";
  $("backExample").textContent = exText;
  $("backExample").style.display = c.example ? "block" : "none";
  $("backExtra").textContent = c.extra || "";

  const doneCount = Math.max(0, idx);
  $("progText").textContent = shown ? `Card ${idx + 1} of ${shown}` : "No cards due";
  $("pctText").textContent = total ? Math.round(doneCount / total * 100) + "%" : "0%";
  $("progFill").style.width = total ? (doneCount / total * 100) + "%" : "0%";

  $("grades").classList.toggle("hidden", !flipped);
}

function setCardFace(showBack) {
  const front = document.querySelector(".face.front");
  const back = document.querySelector(".face.back");
  front.style.display = showBack ? "none" : "flex";
  front.style.opacity = showBack ? "0" : "1";
  back.style.display = showBack ? "flex" : "none";
  back.style.opacity = showBack ? "1" : "0";
}

function flip() {
  if (!queue.length) return;
  flipped = !flipped;
  $("card").classList.toggle("flipped", flipped);
  setCardFace(flipped);
  if (flipped) {
    markSeen(cardId(queue[idx]));
    saveState();
    updateStats();
  }
  $("grades").classList.toggle("hidden", !flipped);
}

function advance(g) {
  if (!flipped) return;
  const c = queue[idx];
  grade(cardId(c), g);
  idx++;
  flipped = false;
  $("card").classList.remove("flipped");
  setCardFace(false);
  updateStats();
  render();
}

function updateStats() {
  const total = CARDS.length;
  const now = Date.now();
  const learned = Object.values(state.progress).filter(p => p.reps >= 2 && p.interval >= 60).length;
  const dueNow = cardsForSet(currentSet()).filter(c => {
    const p = state.progress[cardId(c)];
    return !p || p.due <= now;
  }).length;
  const seen = Object.keys(state.seen).length;
  $("statDone").textContent = learned;
  $("statDue").textContent = dueNow;
  $("statSeen").textContent = seen;
}

function showDone() {
  $("deck").style.display = "none";
  $("grades").style.display = "none";
  $("done").style.display = "block";
  const total = cardsForSet(currentSet()).length;
  $("doneText").innerHTML =
    `You reviewed all <b>${queue.length}</b> due card${queue.length !== 1 ? "s" : ""}.<br>` +
    `The rest of the set will come back later via spaced repetition.<br>` +
    `<span style="font-size:.85em;color:var(--muted)">Tip: press "Study again" to re-drill the same batch immediately.</span>`;
  updateStats();
}

function startDeck() {
  $("done").style.display = "none";
  $("deck").style.display = "";
  $("grades").style.display = "";
  queue = buildDeck(currentSet());
  idx = 0;
  flipped = false;
  $("card").classList.remove("flipped");
  setCardFace(false);
  if (!queue.length) {
    showDone();
    $("doneText").innerHTML = `Nothing is due right now for this set. 🎉<br>Cards you marked Again/Hard will return within minutes.`;
  } else {
    render();
  }
}

/* events */
$("card").addEventListener("click", () => { if (queue.length) flip(); });
document.querySelectorAll(".grade").forEach(btn => {
  btn.addEventListener("click", e => { e.stopPropagation(); advance(btn.dataset.grade); });
});
$("setSelect").addEventListener("change", startDeck);
$("onlyChapter").addEventListener("change", startDeck);
$("dirSelect").addEventListener("change", e => { dir = e.target.value; render(); });
$("resetBtn").addEventListener("click", () => {
  if (confirm("Reset all flashcard progress? This clears your spaced-repetition schedule.")) {
    state = { progress: {}, seen: {} };
    saveState();
    startDeck();
  }
});
$("restartBtn").addEventListener("click", startDeck);

/* keyboard shortcuts */
document.addEventListener("keydown", e => {
  if (!queue.length) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  else if (flipped) {
    if (e.key === "1") advance("again");
    if (e.key === "2") advance("hard");
    if (e.key === "3") advance("good");
    if (e.key === "4") advance("easy");
  }
});

/* init */
loadManifest();   // pre-rendered MP3 map (fires async; first click may still stream)
startDeck();
updateStats();
